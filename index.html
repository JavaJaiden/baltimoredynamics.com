<noscript><div style="max-width:36em;margin:14vh auto;padding:24px;font:400 18px/1.5 Helvetica,Arial,sans-serif;color:#f4f2ec"><h1 style="margin:0 0 .6em;font-size:34px;line-height:1.1">Baltimore Dynamics</h1><p>We started on the water, working directly on Mr. Trash Wheel's mission to clean Baltimore Harbor and running autonomous hulls in the same water. Now we're building rovers for the pipes under the street and aircraft that put water on fires.</p><p>Backed by <a style="color:inherit" href="https://www.northropgrumman.com/">Northrop Grumman</a> and <a style="color:inherit" href="https://www.mrtrashwheel.com/">Mr. Trash Wheel</a>.</p><p style="color:#a8a8a0">The map, drawings and simulations on this site need JavaScript. Turn it on to see them.</p></div></noscript>
